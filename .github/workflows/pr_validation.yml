# GitHub Actions CI workflow.
#
# On every pull_request event (opened, synchronize, reopened) — job `validate`:
#   1. Checks out the repo and sets up Python 3.11
#   2. Installs dependencies from requirements.txt
#   3. Pulls versioned data from Cloudflare R2 via DVC
#      (uses R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT_URL secrets)
#   4. Trains the candidate (PR branch) and registers it in the MLflow Model
#      Registry without an alias (uses MLFLOW_TRACKING_URI,
#      MLFLOW_TRACKING_USERNAME, MLFLOW_TRACKING_PASSWORD secrets)
#   5. Trains the baseline (main branch) and compares both; the job fails if the
#      candidate is not BETTER, which blocks the merge (with branch protection)
#   6. Only if the candidate won: moves the Staging alias to it
#   7. Always posts the validation report as a PR comment and uploads reports/
#
# On every push to main (i.e. a merged PR) — job `promote`:
#   Moves the Production alias to the version currently marked as Staging.

name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  CANDIDATE_DATA_VERSION: v1  # data version trained for the PR branch (baseline always uses main's own default)
  MODEL_NAME: sdg-model

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # required to post the metrics comment on the PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: dvc pull

      # ── Train candidate (PR branch), registered without alias ───────────
      - name: Train candidate model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python pipelines/orchestration.py \
            --data-version ${{ env.CANDIDATE_DATA_VERSION }} \
            --experiment-name sdg-pr-${{ github.event.pull_request.number }} \
            --run-name candidate-pr-${{ github.event.pull_request.number }} \
            --output-dir reports/candidate \
            --register-model

      # ── Train baseline (main branch, separate folder) ────────────────────
      - name: Checkout main for baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline_repo

      - name: Pull baseline data
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          cd baseline_repo
          dvc pull

      - name: Train baseline model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          cd baseline_repo
          pip install -r requirements.txt -q
          python pipelines/orchestration.py \
            --data-version v1 \
            --experiment-name sdg-pr-${{ github.event.pull_request.number }}-baseline \
            --run-name baseline-pr-${{ github.event.pull_request.number }} \
            --output-dir ../reports/baseline

      # ── Compare (fails the job if the candidate is not BETTER) ───────────
      - name: Compare candidate vs baseline
        run: |
          python src/evaluation/compare.py \
            --candidate reports/candidate/train_metrics.json \
            --baseline  reports/baseline/train_metrics.json \
            --output-dir reports/ \
            --dagshub-url "${{ secrets.MLFLOW_TRACKING_URI }}" \
            --candidate-version ${{ env.CANDIDATE_DATA_VERSION }} \
            --baseline-version v1 \
            --fail-if-worse

      # ── Only reached when the comparison passed ──────────────────────────
      - name: Mark candidate as Staging
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python - <<'EOF'
          import json, mlflow
          version = json.load(open("reports/candidate/model_info.json"))["registry_model_version"]
          mlflow.MlflowClient().set_registered_model_alias("${{ env.MODEL_NAME }}", "Staging", version)
          print(f"${{ env.MODEL_NAME }} v{version} -> Staging")
          EOF

      # ── Post or update PR comment (also when the comparison failed) ──────
      - name: Post validation report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/pr_comment.md')) {
              core.warning('reports/pr_comment.md not found: an earlier step failed before the comparison');
              return;
            }
            const body = fs.readFileSync('reports/pr_comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## SDG Model Validation Report')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-pr-${{ github.event.pull_request.number }}
          path: reports/

  # ── On merge to main: Staging → Production ──────────────────────────────
  # No checkout, DVC or training needed: it only moves an alias in the registry
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLflow
        run: pip install mlflow==2.22.4

      - name: Promote Staging to Production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python - <<'EOF'
          import mlflow
          from mlflow.exceptions import MlflowException
          client = mlflow.MlflowClient()
          try:
              version = client.get_model_version_by_alias("${{ env.MODEL_NAME }}", "Staging").version
          except MlflowException:
              # e.g. a direct push to main with no validated PR behind it
              print("No Staging version found, nothing to promote")
          else:
              client.set_registered_model_alias("${{ env.MODEL_NAME }}", "Production", version)
              print(f"${{ env.MODEL_NAME }} v{version} -> Production")
          EOF
